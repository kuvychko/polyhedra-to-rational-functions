name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # From the lock file, unlike complexplorer's CI: run records are only comparable on the
      # pinned environment, so that is the one tested.
      - run: uv sync --locked
      - name: Headless display (Linux)
        if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v3
      - run: uv run --no-sync pytest -q

  docs:
    name: Site (mkdocs build --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group docs
      # Builds only. Deployment is a release step (decision 0006), not part of CI.
      - run: uv run --no-sync mkdocs build --strict
      # Subpath-safe links, alt text and local images in the built HTML (scripts/a5_check_site.py).
      - run: uv run --no-sync python scripts/a5_check_site.py
