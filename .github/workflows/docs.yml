name: Deploy site

# Publishes the site to GitHub Pages (the gh-pages branch). Deployment is a deliberate step
# (decision 0006): only a person choosing to run this workflow publishes. Pushes build the site
# in CI (the `docs` job there) but never publish it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-deploy pushes to gh-pages and needs that branch's history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      # The package is part of the build: the hooks generate the object pages and the recipe
      # comparison data from it.
      - run: uv sync --locked --group docs
      # Build and check strictly first. A site that cannot build cleanly must not replace a
      # working one.
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync python scripts/a5_check_site.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync mkdocs gh-deploy --force --no-history
