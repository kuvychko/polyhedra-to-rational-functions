name: Deploy site

# Publishes the site to GitHub Pages (the gh-pages branch).
#
# - Automatically, after CI passes on a push to main: lint, tests on both platforms and the
#   strict site build must all succeed first, so a broken commit never replaces the live site.
# - By hand (Run workflow), to redeploy without a new commit.
#
# Pushes to other branches build the site in CI but never publish it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    # Only a successful CI run on a push deploys (not a pull request's run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # gh-deploy pushes to gh-pages and needs that branch's history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      # The package is part of the build: the hooks generate the object pages and the recipe
      # comparison data from it.
      - run: uv sync --locked --group docs
      # Build and check strictly first. A site that cannot build cleanly must not replace a
      # working one.
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync python scripts/a5_check_site.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync mkdocs gh-deploy --force --no-history
